<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>架構中 | Coming Soon</title>
  <style>
    :root {
      --bg-color: #f0f7fa;
      --card-bg: #ffffff;
      --text-main: #1f2d3d;
      --text-sub: #5c6b77;
      --accent: #0288d1;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0b1520;
        --card-bg: #142232;
        --text-main: #e2eaf1;
        --text-sub: #8ca3b8;
        --accent: #38bdf8;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      background: var(--card-bg);
      padding: 48px 36px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.8s ease-out;
    }

    .icon-wrapper {
      font-size: 56px;
      display: inline-block;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
      user-select: none;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(2, 136, 209, 0.15);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 45%;
      background: var(--accent);
      border-radius: 999px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
        transform: scaleX(0.95);
      }
      50% {
        opacity: 1;
        transform: scaleX(1.05);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon-wrapper" aria-hidden="true">🐬</div>
    <h1>這裡還在架構中，請耐心等待🐬</h1>
    <div class="progress-bar" role="progressbar" aria-label="建置中進度條">
      <div class="progress-fill"></div>
    </div>
  </main>
</body>
</html>
